name: Score Snapshot

on:
  schedule:
    # Every minute, 12:00-00:00 UTC (8am-8pm ET), Apr 9-13
    - cron: '* 12-23 9-13 4 *'
    - cron: '* 0 10-14 4 *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run snapshot
        run: node scripts/snapshot.mjs 2>&1

      - name: Generate backfillHistory.js
        run: |
          node -e "
          const fs = require('fs');
          const history = JSON.parse(fs.readFileSync('scripts/score-history.json', 'utf-8'));
          const lines = history.map(s => '  ' + JSON.stringify(s));
          const out = '// Auto-generated by GitHub Actions on ' + new Date().toISOString() + '\n'
            + '// ' + history.length + ' snapshots\n'
            + 'export const BACKFILL_HISTORY = [\n'
            + lines.join(',\n') + ',\n'
            + '];\n';
          fs.writeFileSync('src/data/backfillHistory.js', out);
          console.log('Wrote ' + history.length + ' snapshots to backfillHistory.js');
          "

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/score-history.json src/data/backfillHistory.js
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: score snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
